name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: tripi
          POSTGRES_PASSWORD: tripi
          POSTGRES_DB: tripi
        # 5433 on the host to match docker-compose.yml, so DATABASE_URL is
        # byte-identical locally and in CI.
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U tripi -d tripi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Review §3.3: the e2e suite asserts on real delivered mail. Without this
      # service every waitForEmail() times out and six tests can never be green.
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tripi:tripi@localhost:5433/tripi
      HOCUSPOCUS_PORT: '1234'
      HOCUSPOCUS_JWT_SECRET: ci-secret-that-is-at-least-thirty-two-chars
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_HOCUSPOCUS_URL: ws://localhost:1234
      # PRD §7b stage. Security posture keys on this, not NODE_ENV — `next
      # build` and `next start` both run NODE_ENV=production here.
      APP_STAGE: local
      BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-thirty-two-chars
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      EMAIL_FROM: Tripi <no-reply@tripi.local>
      REQUIRE_EMAIL_VERIFICATION: 'false'
      RATE_LIMIT_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4

      # No `version:` — the action reads packageManager from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A03 (Software Supply Chain Failures). Pinned versions and a committed
      # lockfile stop drift; this is how we learn a pin became vulnerable.
      # Today this repo reports 1 moderate (esbuild GHSA-67mh-4wv8-2f99, via
      # drizzle-kit > @esbuild-kit/*, no fix path) and passes at --audit-level=high.
      # Do NOT lower the threshold to make a real high-severity finding pass.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Production parity: the artefacts the e2e step serves are built here, so a
      # build break reports as a build break rather than as a webServer timeout.
      - name: Build
        run: pnpm build

      - name: Assert the realtime artefact is self-contained
        run: |
          if grep -q '@tripi/shared' services/realtime/dist/server.mjs; then
            echo "::error::dist/server.mjs still imports @tripi/shared — check deps.alwaysBundle in tsdown.config.ts"
            exit 1
          fi

      - name: Assert no database driver in the client bundle
        run: |
          if grep -rlq "postgres-js\|node:tls" apps/web/.next/static/chunks/; then
            echo "::error::server code reached the browser bundle"
            exit 1
          fi

      - name: Install Playwright browser
        run: pnpm --filter @tripi/web exec playwright install chromium --with-deps

      - name: End-to-end tests against the build
        run: pnpm e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
